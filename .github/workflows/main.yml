name: Compiler le .exe Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compiler en .exe
        run: pyinstaller --noconfirm --onefile --windowed --name ControleStocksImmos app.py

      - name: Publier l'exe (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: ControleStocksImmos-windows
          path: dist/ControleStocksImmos.exe

      - name: Publier dans une Release (si tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ControleStocksImmos.exe
